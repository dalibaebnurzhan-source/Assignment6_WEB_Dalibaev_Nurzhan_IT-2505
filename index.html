<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Party - Assignment #6</title>
    <link rel="stylesheet" href="style.css">
    <!-- jQuery қосу -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <!-- Йорттың сыртқы қаңқасы -->
    <div class="house-container">
        <!-- Түбә мен труба -->
        <div class="roof">
            <div class="roof-window"></div>
        </div>
        <div class="chimney"></div>

        <!-- Кештің басты тақырыбы -->
        <div class="house-header">
            <h2>The Party, 19:30 – 22:30</h2>
        </div>

        <!-- Батырмалар мен тазарту түймесі -->
        <div class="controls-section">
            <div id="case-buttons"></div>
            <button id="clear-btn">Clear Spotlight</button>
        </div>

        <!-- 2-ші қабат (Balcony & Hall) -->
        <div class="floor" data-floor="2">
            <div class="floor-label">FLOOR 2</div>
            <div class="rooms-container">
                <div class="room" data-room="Balcony">
                    <div class="room-title">Balcony</div>
                    <div class="guests-container"></div>
                </div>
                <div class="room" data-room="Hall">
                    <div class="room-title">Hall</div>
                    <div class="guests-container"></div>
                </div>
            </div>
        </div>

        <!-- 1-ші қабат (Kitchen & Living room) -->
        <div class="floor" data-floor="1">
            <div class="floor-label">FLOOR 1</div>
            <div class="rooms-container">
                <div class="room" data-room="Kitchen">
                    <div class="room-title">Kitchen</div>
                    <div class="guests-container"></div>
                </div>
                <div class="room" data-room="Living room">
                    <div class="room-title">Living room</div>
                    <div class="guests-container"></div>
                </div>
            </div>
        </div>

        <!-- Фундамент және Легенда (Анықтама панелі) -->
        <div class="foundation">
            <div class="legend-bar">
                <div class="legend-section">
                    <div class="color-dots">
                        <span class="dot" style="background: #e11d48;"></span>
                        <span class="dot" style="background: #2563eb;"></span>
                        <span class="dot" style="background: #16a34a;"></span>
                        <span class="dot" style="background: #1f2937;"></span>
                        <span class="dot" style="background: #ca8a04;"></span>
                        <span class="dot" style="background: #9333ea;"></span>
                    </div>
                    <span class="legend-text">Clothing color</span>
                </div>
                
                <div class="legend-section icons-legend">
                    <span>📱 Phone</span>
                    <span>👓 Glasses</span>
                    <span>🛍️ Bag</span>
                    <span>☕ Cup</span>
                    <span>🍰 Cake crumbs</span>
                </div>
                
                <div class="legend-section">
                    <span>🕒 Arrival time</span>
                    <span>🎓 AITU student</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальды терезе -->
    <div id="modal-card" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
